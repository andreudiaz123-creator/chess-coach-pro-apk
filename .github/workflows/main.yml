name: Compilar APK de Chess Coach Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: Aceptar licencias de Android SDK y compilar APK con Gradle
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon

      - name: Publicar APK listo para descargar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_FILE" ChessCoachPro.apk
          TAG_NAME="apk-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG_NAME" ChessCoachPro.apk \
            --title "Chess Coach Pro APK (#${GITHUB_RUN_NUMBER})" \
            --notes "Descarga el archivo **ChessCoachPro.apk** de abajo e instálalo directamente en tu teléfono Android."
